{% extends 'base.html' %}
{% block title %}新增單字{% endblock %}

{% block extra_head %}
<style>
  .lookup-spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">新增單字</h1>
    <p class="page-subtitle">輸入單字，自動從字典查詢定義與例句</p>
  </div>
</div>

<div style="max-width:600px;">
  <form method="post" id="add-word-form">
    {% csrf_token %}

    <!-- 單字輸入 + 查詢按鈕 -->
    <div class="form-group">
      <label class="form-label" for="id_text">單字 <span style="color:var(--red)">*</span></label>
      <div style="display:flex;gap:10px;">
        <input type="text" id="id_text" name="text" class="form-control"
               placeholder="e.g. meticulous"
               value="{{ form_data.text|default:'' }}"
               autocomplete="off" />
        <button type="button" id="lookup-btn" class="btn btn-ghost">
          查詢
        </button>
      </div>
      <div id="lookup-status"></div>
    </div>

    <!-- API 預覽區 -->
    <div id="api-preview" class="api-preview card-sm mb-2">
      <div style="font-size:0.8rem;font-weight:600;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.06em;">
        字典結果（供參考）
      </div>
      <div id="api-senses"></div>
      <div id="audio-section" style="margin-top:10px;display:none;">
        <button type="button" id="play-audio-btn" class="btn btn-ghost btn-sm">
          🔊 播放發音
        </button>
        <audio id="audio-player" style="display:none;"></audio>
      </div>
    </div>

    <hr class="divider" />

    <!-- 中文翻譯（必填，API 不提供）-->
    <div class="form-group">
      <label class="form-label" for="id_translation">中文翻譯 <span style="color:var(--red)">*</span></label>
      <input type="text" id="id_translation" name="translation" class="form-control"
             placeholder="e.g. 一絲不苟的；極注重細節的"
             value="{{ form_data.translation|default:'' }}" />
    </div>

    <!-- 英文定義（可從 API 自動填入）-->
    <div class="form-group">
      <label class="form-label" for="id_definition">英文定義</label>
      <textarea id="id_definition" name="definition" class="form-control"
                placeholder="e.g. showing great attention to detail or correct behavior">{{ form_data.definition|default:'' }}</textarea>
      <div class="form-hint">API 可自動填入，亦可手動編輯</div>
    </div>

    <!-- 例句 -->
    <div class="form-group">
      <label class="form-label" for="id_example">例句</label>
      <textarea id="id_example" name="example" class="form-control"
                placeholder="e.g. She is meticulous about her work.">{{ form_data.example|default:'' }}</textarea>
    </div>

    <!-- 個人備註 -->
    <div class="form-group">
      <label class="form-label" for="id_note">個人備註</label>
      <input type="text" id="id_note" name="note" class="form-control"
             placeholder="記憶技巧、聯想詞..."
             value="{{ form_data.note|default:'' }}" />
    </div>

    <!-- 隱藏：音檔 URL、音標與詞性 -->
    <input type="hidden" id="id_audio_url" name="audio_url" value="" />
    <input type="hidden" id="id_phonetic" name="phonetic" value="" />
    <input type="hidden" id="id_part_of_speech" name="part_of_speech" value="" />

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button type="submit" class="btn btn-primary" id="submit-btn">加入字庫</button>
      <a href="{% url 'vocab:my_vocab' %}" class="btn btn-ghost">取消</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function() {
  const textInput    = document.getElementById('id_text');
  const lookupBtn    = document.getElementById('lookup-btn');
  const statusDiv    = document.getElementById('lookup-status');
  const previewDiv   = document.getElementById('api-preview');
  const sensesDiv    = document.getElementById('api-senses');
  const audioSection = document.getElementById('audio-section');
  const audioPlayer  = document.getElementById('audio-player');
  const playAudioBtn = document.getElementById('play-audio-btn');
  const defInput     = document.getElementById('id_definition');
  const exInput      = document.getElementById('id_example');
  const audioUrlInput= document.getElementById('id_audio_url');
  const phoneticInput = document.getElementById('id_phonetic');
  const posInput      = document.getElementById('id_part_of_speech');

  let lookupTimeout = null;
  let lastWord = textInput.value.trim();

  function setStatus(type, msg) {
    statusDiv.innerHTML = `<div class="lookup-status ${type}">${msg}</div>`;
  }

  async function lookup(word) {
    if (!word.trim()) return;
    setStatus('loading', '<span class="lookup-spinner"></span> 查詢中...');
    previewDiv.classList.remove('visible');

    try {
      const resp = await fetch(`{% url 'vocab:lookup_word_api' %}?word=${encodeURIComponent(word.trim())}`);
      const data = await resp.json();

      if (!resp.ok) {
        setStatus('error', data.error || '查詢失敗');
        return;
      }

      // 渲染 sense 列表
      let html = '';
      data.senses.forEach((sense, si) => {
        html += `<div class="sense-item">
          <div class="sense-pos">${sense.part_of_speech}</div>`;
        sense.definitions.forEach((d, di) => {
          html += `<div class="sense-def">${d.definition}
            <button type="button" class="btn btn-ghost btn-sm"
              style="margin-left:8px;padding:2px 8px;font-size:0.72rem;"
              onclick="fillDef(${JSON.stringify(d.definition)}, ${JSON.stringify(d.example)})">
              使用此定義
            </button>
          </div>`;
          if (d.example) {
            html += `<div class="sense-example">"${d.example}"</div>`;
          }
        });
        html += '</div>';
      });

      if (html === '') {
        html = '<div class="text-muted text-sm">無可用定義</div>';
      }

      sensesDiv.innerHTML = html;
      previewDiv.classList.add('visible');

      // 判定是否為不同於上一次查詢的新單字
      const isNewWord = lastWord.toLowerCase() !== data.word.toLowerCase();
      lastWord = data.word;

      // 音檔、音標與詞性
      if (data.audio_url) {
        audioUrlInput.value = data.audio_url;
        audioPlayer.src = data.audio_url;
        audioSection.style.display = 'block';
      } else {
        audioUrlInput.value = '';
        audioPlayer.src = '';
        audioSection.style.display = 'none';
      }

      if (data.phonetic) {
        phoneticInput.value = data.phonetic;
      } else {
        phoneticInput.value = '';
      }

      if (data.senses && data.senses[0]) {
        posInput.value = data.senses[0].part_of_speech;
      } else {
        posInput.value = '';
      }

      // 如果是新單字，或欄位為空，自動填入第一個定義
      const firstSense = data.senses[0];
      if (firstSense && firstSense.definitions[0]) {
        const firstDef = firstSense.definitions[0];
        if (isNewWord || !defInput.value.trim()) {
          defInput.value = firstDef.definition;
        }
      } else if (isNewWord) {
        defInput.value = '';
      }

      // 如果是新單字，或欄位為空，自動填入第一個非空例句
      if (isNewWord || !exInput.value.trim()) {
        let foundExample = '';
        for (const sense of data.senses) {
          for (const d of sense.definitions) {
            if (d.example && d.example.trim()) {
              foundExample = d.example.trim();
              break;
            }
          }
          if (foundExample) break;
        }
        exInput.value = foundExample;
      }

      // 如果是新單字，或欄位為空，自動填入中文翻譯
      const transInput = document.getElementById('id_translation');
      if (data.translation) {
        if (isNewWord || !transInput.value.trim()) {
          transInput.value = data.translation;
        }
      } else if (isNewWord) {
        transInput.value = '';
      }

      setStatus('success', `✓ 找到「${data.word}」的字典資料`);

    } catch(e) {
      console.error(e);
      setStatus('error', '網路錯誤，請手動填入或稍後再試。');
    }
  }

  window.fillDef = function(def, example) {
    defInput.value = def;
    if (example) exInput.value = example;
  };

  // 按查詢按鈕
  lookupBtn.addEventListener('click', () => {
    lookup(textInput.value);
  });

  // 輸入後延遲自動查詢（防抖）
  textInput.addEventListener('input', () => {
    clearTimeout(lookupTimeout);
    if (textInput.value.trim().length < 2) return;
    lookupTimeout = setTimeout(() => lookup(textInput.value), 900);
  });

  // Enter 直接查詢
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      lookup(textInput.value);
    }
  });

  // 播放音檔
  playAudioBtn.addEventListener('click', () => {
    audioPlayer.play();
  });
})();
</script>
{% endblock %}
